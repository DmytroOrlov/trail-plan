schema_version: "1.0"
id: trail-plan-speckit-completion
name: "Full SDD Cycle completion overlay (trail-plan)"
extends: speckit
description: >-
  Project-local overlay extending the bundled "Full SDD Cycle" beyond
  `implement` through the constitution's later lifecycle stages
  (.specify/memory/constitution.md §Spec Kit Change Lifecycle): converge,
  independent review, and executable-regression/traceability verification.
  The bundled base workflow material stays untouched; this overlay only adds
  repository-owned completion steps.
edits:
  # Anchors must be base step ids. Multiple insert_after edits at the same
  # anchor apply in list order, producing:
  # implement -> converge -> independent-review ->
  # executable-regression-verification -> traceability-verification
  - insert_after: implement
    step:
      id: converge
      command: speckit.converge
      integration: "{{ inputs.integration }}"
      input:
        args: "{{ inputs.spec }}"

  - insert_after: implement
    step:
      id: independent-review
      type: gate
      message: >-
        Independent review of the completed change against spec.md, plan.md,
        tasks.md, and the canonical owners (docs/PRODUCT_CONTRACT.md,
        docs/ARCHITECTURE.md, docs/CURRENT_STATE.md, docs/TEST_MATRIX.md,
        docs/adr/). Constitution III/IV: no silent weakening, evidence before
        promotion.
      options: [approve, reject]
      on_reject: abort

  - insert_after: implement
    step:
      id: executable-regression-verification
      type: shell
      command: >-
        ./trail-plan.scala --input ./trails --output
        "${TRAIL_PLAN_WORKFLOW_OUTPUT:-/tmp/trail-plan-workflow}" --valhalla-url
        "${VALHALLA_URL:-http://localhost:8002}"

  - insert_after: implement
    step:
      id: traceability-verification
      type: gate
      message: >-
        Verify executable-regression and traceability completion: every newly
        established durable invariant was promoted via
        .agents/skills/invariant-promotion/SKILL.md BEFORE
        .agents/skills/test-traceability-sync/SKILL.md synchronized
        docs/TEST_MATRIX.md with docs/PRODUCT_CONTRACT.md and
        docs/ARCHITECTURE.md, and the full default suite passed. Report
        BLOCKED (constitution V) instead of approving if deterministic
        regression protection is missing or structurally impossible.
      options: [approve, reject]
      on_reject: abort
